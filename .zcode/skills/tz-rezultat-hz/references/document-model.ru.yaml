# Каталог элементов модели документа.
# Поля: id, level (document|page|formatting), text_element,
# variability (stable|variable), expected_size, description, detection,
# parser, attributes, attributes_optional, sample_refs.
# Обязательные поля: id, level, variability, detection, parser, attributes.
# sample_refs заполняется после прогона detection по образцам.
# Присутствие элемента в шаблоне: правило большинства (>= 75% образцов;
# оформление — пересечение всех). Вариации выносятся пользователю.
# Стандарты-основания: ГОСТ Р 7.0.8-2013 (определение документа),
# ГОСТ Р 7.0.97-2016 (формуляр-образец, реквизиты), ГОСТ 7.32-2017
# (структура отчёта), ГОСТ 2.104/2.301 (ЕСКД: штамп, рамка),
# ISO 15489 (управление документами), ISO/IEC/IEEE 82079-1 (инструкции),
# OASIS DITA 1.3 bookmap (frontmatter/body/backmatter).

catalog:
  # ── Уровень документа ────────────────────────────────────────────────
  - id: title-page
    confirmed: samples
    level: document
    text_element: false
    variability: stable
    expected_size: "первая страница, ~20 строк, порог ±30% (12–30 параграфов)"
    description: >-
      Титульный лист: организация, вид документа, код, версия,
      наименование, грифы согласования/утверждения, город и год.
    detection: >-
      Первая страница документа; количество параграфов 12–30; нет
      inline-изображений тела; есть текст по шаблонам грифов
      (согласовано/утверждаю) или подписных строк (Разраб./Проверил).
    parser: >-
      python-docx: doc.paragraphs[:30]; взять тексты непустых параграфов
      по порядку; сопоставить строки с атрибутами по паттернам
      (код документа — регэксп буквенно-цифрового кода, версия — V\\d+,
      год — \\d{4}).
    attributes: [organization, doc_kind, doc_code, doc_title, city_year]
    attributes_optional: [version, approvals, udk_index]
    sample_refs: []

  - id: performers-list
    level: document
    text_element: false
    variability: variable
    expected_size: "таблица или список, строки = исполнители (1–20)"
    description: >-
      Лист/список исполнителей: кто разработал, проверил, согласовал;
      должности, фамилии, подписи.
    detection: >-
      Заголовок «СОДЕРЖАНИЕ ИСПОЛНИТЕЛЕЙ»/«Исполнители» или таблица с
      колонками должность/фамилия/подпись в первых 10 страницах.
    parser: >-
      python-docx: найти заголовок по тексту; дальше параграфы или
      table.rows → по строке: роль, ФИО, подпись.
    attributes: [role, name]
    attributes_optional: [position, signature, date]
    sample_refs: []

  - id: abstract
    level: document
    text_element: true
    variability: stable
    expected_size: "одна страница, 1–5 абзацев"
    description: >-
      Реферат/аннотация: сжатое описание назначения и содержания
      документа (Abstract, Executive Summary).
    detection: >-
      Заголовок «РЕФЕРАТ»/«Аннотация»/«Abstract» в первых 10 страницах;
      после него 1–5 абзацев до следующего заголовка.
    parser: >-
      python-docx: собрать текст параграфов между заголовком реферата
      и следующим заголовком уровня 1.
    attributes: [text]
    sample_refs: []

  - id: toc
    level: document
    text_element: true
    variability: variable
    expected_size: "строк = число заголовков; сильная вариативность"
    description: >-
      Содержание (оглавление): перечень разделов с номерами страниц;
      генерируется из заголовков документа.
    detection: >-
      Поле TOC (w:instrText содержит "TOC") или заголовок «СОДЕРЖАНИЕ»,
      за которым следуют строки «текст … номер страницы».
    parser: >-
      python-docx: перебрать параграфы после заголовка; каждую строку
      разбить регэкспом ^(.*?)\\.{2,}\\s*(\\d+)$ → заголовок, страница.
    attributes: [section_title, page_number]
    requires: [numbered-heading]
    requires_note: >-
      Оглавление генерируется из заголовков: без нумерованных заголовков
      (и разделов под них) элемент пуст. Выбор toc автоматически
      расширяет объём на каркас нумерованных заголовков — с явным
      докладом пользователю, не молча.
    sample_refs: []

  - id: illustrations-list
    level: document
    text_element: false
    variability: variable
    expected_size: "строк = число рисунков"
    description: "Перечень иллюстраций: список «Рисунок N — название … страница»."
    detection: >-
      Заголовок «ПЕРЕЧЕНЬ ИЛЛЮСТРАЦИЙ» или строки по шаблону
      «Рисунок N» с точками-заполнителями и номером страницы.
    parser: >-
      Аналогично toc: регэксп ^(Рисунок\\s+\\d+[—–-].*?)\\.{2,}\\s*(\\d+)$.
    attributes: [figure_caption, page_number]
    sample_refs: []

  - id: tables-list
    level: document
    text_element: false
    variability: variable
    expected_size: "строк = число таблиц"
    description: "Перечень таблиц: список «Таблица N — название … страница»."
    detection: >-
      Заголовок «ПЕРЕЧЕНЬ ТАБЛИЦ» или строки по шаблону «Таблица N»
      с точками-заполнителями и номером страницы.
    parser: >-
      Аналогично illustrations-list: регэксп ^(Таблица\\s+\\d+[—–-].*?)\\.{2,}\\s*(\\d+)$.
    attributes: [table_caption, page_number]
    sample_refs: []

  - id: terms-definitions
    confirmed: samples
    level: document
    text_element: true
    variability: variable
    expected_size: "пары «термин — определение», 1–50"
    description: "Термины и определения: таблица или список «термин — расшифровка»."
    detection: >-
      Заголовок «Термины и определения»/«Определения»/«Глоссарий»; далее
      таблица из 2 колонок или список с висячим отступом «термин — текст».
    parser: >-
      python-docx: если таблица — table.rows → (cell[0], cell[1]);
      если список — регэксп ^(\\S[^—-]*?)\\s*[—-]\\s*(.+)$.
    attributes: [term, definition]
    sample_refs: []

  - id: abbreviations
    level: document
    text_element: true
    variability: variable
    expected_size: "пары «аббревиатура — расшифровка», 1–50"
    description: "Перечень сокращений и обозначений; классика — в начале документа парами абзацев, вариант — раздел «Глоссарий»/«Термины и сокращения» с подписью и таблицей на 2 колонки."
    detection: >-
      Заголовок «ПЕРЕЧЕНЬ СОКРАЩЕНИЙ И ОБОЗНАЧЕНИЙ»/«Сокращения»/«Глоссарий»/
      «Термины и сокращения» (классика — в первых 20% документа, вариант —
      в середине); далее пары «АББРЕВИАТУРА — расшифровка» абзацами ИЛИ
      подпись «Таблица N. …» + таблица 2 колонки с шапкой
      «Термин/сокращение | Определение/расшифровка» или «Термин | Описание».
    parser: >-
      python-docx: параграфы после заголовка; регэксп
      ^([А-ЯA-Z]{2,}[\\dА-ЯA-Z]*)\\s*[—–-]?\\s*(.+)$ → аббревиатура, расшифровка.
      Табличная форма: блоки секции (вводная строка, подпись Caption,
      таблица) переносятся как есть, первая строка данных → example_row.
    attributes: [abbr, expansion]
    sample_refs: []

  - id: normative-references
    level: document
    text_element: false
    variability: variable
    expected_size: "нумерованный перечень, 0–30 записей"
    description: "Нормативные ссылки: перечень стандартов и документов, на которые ссылается данный."
    detection: >-
      Заголовок «Нормативные ссылки»/«Нормативные документы»; далее
      строки, начинающиеся с ГОСТ/ISO/РД.
    parser: >-
      python-docx: параграфы после заголовка до следующего заголовка;
      каждая строка — одна запись.
    attributes: [reference_text]
    sample_refs: []

  - id: introduction
    level: document
    text_element: true
    variability: variable
    expected_size: "1–5 страниц, 2–20 абзацев"
    description: "Введение: цели, область применения, статус документа."
    detection: >-
      Заголовок «ВВЕДЕНИЕ»/«Введение» после начальных разделов
      (содержание, сокращения).
    parser: >-
      python-docx: параграфы между заголовком «Введение» и следующим
      заголовком уровня 1; каждый абзац — элемент списка text.
    attributes: [text]
    sample_refs: []

  - id: body
    confirmed: samples
    level: document
    text_element: true
    variability: variable
    expected_size: "5–25 разделов; сильная вариативность (короткое/длинное ТЗ)"
    description: >-
      Основная часть: уникальное тело документа; в ТЗ — требования,
      алгоритмы «если—тогда», рисунки, таблицы.
    detection: >-
      Всё между заголовком «ОСНОВНАЯ ЧАСТЬ»/первым нумерованным
      разделом и «ЗАКЛЮЧЕНИЕ»/«ИСТОЧНИКИ»/приложениями. В бизнес-ТЗ
      разделы тела: «Задание на разработку», «Бизнес-логика»,
      «Глоссарий», «Права доступа», «Ограничения и допущения»,
      «Порядок тестирования» — без отдельной «ОСНОВНОЙ ЧАСТИ».
    parser: >-
      Итерировать по document.element.body в порядке документа;
      каждому элементу сопоставить тип (параграф → стиль, таблица →
      разбор строк, рисунок → подпись); разделы группировать по
      заголовкам с иерархической нумерацией.
    attributes: [sections]
    sample_refs: []

  - id: conclusion
    level: document
    text_element: true
    variability: variable
    expected_size: "1–3 страницы"
    description: "Заключение: итоги, выводы."
    detection: "Заголовок «ЗАКЛЮЧЕНИЕ»/«Заключение» в последней трети документа."
    parser: >-
      python-docx: параграфы между заголовком «Заключение» и следующим
      заголовком уровня 1.
    attributes: [text]
    sample_refs: []

  - id: sources
    confirmed: samples
    level: document
    text_element: true
    variability: variable
    expected_size: "нумерованный перечень, 0–50 записей; в конце документа"
    description: "Список использованных источников: библиографические записи."
    detection: >-
      Заголовок «СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ»/«Источники»/
      «Литература» ближе к концу; далее нумерованные строки.
    parser: >-
      python-docx: параграфы после заголовка; регэксп ^(\\d+)\\.?\\s+(.+)$
      → номер, запись.
    attributes: [index, reference_text]
    sample_refs: []

  - id: appendices
    level: document
    text_element: true
    variability: variable
    expected_size: "0–N приложений, каждое с нового листа"
    description: >-
      Приложения: страницы-персонажи с заголовком «ПРИЛОЖЕНИЕ А» и
      двойной нумерацией (сквозная + А-1).
    detection: >-
      Параграф по шаблону ^ПРИЛОЖЕНИЕ\\s+[А-ЯA-Z]\\b или заголовок
      «ПРИЛОЖЕНИЕ»/«Приложение» после основной части; при разрыве
      секции — новая секция с другой нумерацией.
    parser: >-
      python-docx: от параграфа «ПРИЛОЖЕНИЕ X» до следующего такого же
      или конца документа; внутри — обычный разбор тела.
    attributes: [letter, title, content]
    sample_refs: []

  - id: change-log-sheet
    level: document
    text_element: true
    variability: stable
    expected_size: "таблица с фиксированными колонками; часто пустая"
    description: >-
      Лист регистрации изменений: таблица «Изм. — изменённые листы —
      основание — подпись — дата»; заполняется жизненным циклом.
    detection: >-
      Таблица, шапка которой содержит колонки «Изм.» и «Лист» и
      «№ докум.»/«Основание».
    parser: >-
      python-docx: найти таблицу по шапке; table.rows → словарь
      колонка → значение; пустые ячейки → None (пропускать явно).
    attributes: [revision, sheets_affected, reason, date]
    attributes_optional: [signature]
    sample_refs: []

  - id: approval-sheet
    level: document
    text_element: true
    variability: stable
    expected_size: "таблица/строки «роль — имя — подпись — дата»"
    description: >-
      Лист согласования: подписи «разработал — проверил — согласовал —
      утвердил».
    detection: >-
      Таблица или блок параграфов с ролями Разраб./Пров./Н.контр./Утв.
      или «Согласовано»/«Утверждаю».
    parser: >-
      python-docx: строки блока/таблицы; регэксп
      ^(Разраб|Пров|Согла|Утв|Н\\.контр)\\.?\\s+(.+)$ → роль, данные.
    attributes: [role, name, date]
    attributes_optional: [signature, position]
    sample_refs: []

  - id: colophon
    level: document
    text_element: false
    variability: stable
    expected_size: "1–5 строк в конце или на титуле"
    description: "Колофон (выходные данные): город, год, версия, контакт."
    detection: >-
      Финальная страница: строки «Город — Год», «© организация»,
      «Версия X.Y» после последнего содержательного блока.
    parser: >-
      python-docx: последние 10 непустых параграфов; сопоставить
      паттернам город/год, копирайт, версия.
    attributes: [city, year]
    selectable: false
    attributes_optional: [copyright, version, contact]
    sample_refs: []

  - id: cross-references
    level: document
    text_element: false
    variability: variable
    expected_size: "встречаются по всему телу; количество переменное"
    description: "Перекрёстные ссылки: «см. п. 4.2», «(Рисунок - 3)» — документ ссылается сам на себя."
    detection: >-
      В тексте параграфов регэкспы (см\\.\\s*(п\\.|рис\\.|табл\\.?)\\s*[\\d.А-Я]) |
      \\(Рисунок\\s*-\\s*\\d+\\) | \\(Таблица\\s*-\\s*\\d+\\).
    parser: >-
      Обойти все параграфы; извлечь совпадения регэкспов; для каждого —
      тип цели (раздел/рисунок/таблица) и её номер.
    attributes: [ref_type, ref_number]
    selectable: false
    sample_refs: []

  - id: numbering-scheme
    level: document
    text_element: false
    variability: stable
    expected_size: "1 система нумерации на документ"
    description: >-
      Правила нумерации объектов: разделы 1 → 1.1 → 1.1.1, рисунки,
      таблицы, формулы, коды документов (ФР.000.00.00.0-00).
    detection: >-
      По заголовкам: наличие иерархических номеров ^(\\d+)(\\.\\d+)*\\s
      в стилях Heading; по подписям: «Рисунок N», «Таблица N».
    parser: >-
      Собрать все заголовки; регэкспом извлечь номера; построить
      дерево; проверить монотонность нумерации рисунков/таблиц.
    attributes: [scheme_type]
    selectable: false
    attributes_optional: [doc_code_pattern]
    sample_refs: []

  - id: scope-audience
    level: document
    text_element: false
    variability: stable
    expected_size: "1–2 абзаца во введении или на титуле"
    description: "Область действия и целевая аудитория: для кого документ (ISO 82079-1)."
    detection: >-
      Во введении или титуле: текст по паттернам «Настоящее …
      распространяется», «предназначено для», «область применения».
    parser: >-
      python-docx: параграфы введения/титула с регэкспом
      (распространяется|предназначен[оы]? для) → извлечь абзац целиком.
    attributes: [scope_text, audience]
    selectable: false
    sample_refs: []

  - id: signature
    level: document
    text_element: false
    variability: stable
    expected_size: "блок подписей и/или грифы согласования; строки с ролью, ФИО, датой"
    description: >-
      Подписи и грифы — главный реквизит, придающий документу силу
      («разработал — проверил — согласовал — утвердил», «УТВЕРЖДАЮ»,
      блок ЗАКАЗЧИК/ИСПОЛНИТЕЛЬ); ГОСТ Р 7.0.97.
    detection: >-
      Таблица или блок строк с ролями (Разраб./Пров./Н.контр./Утв.,
      ЗАКАЗЧИК/ИСПОЛНИТЕЛЬ, Согласовано/Утверждаю) в титуле или конце
      документа.
    parser: >-
      python-docx: строки блока/таблицы → (роль, ФИО, дата); вложенные
      таблицы проверять cell.tables (cell.text их не видит).
    attributes: [role, name, date]
    attributes_optional: [signature, position, org]
    sample_refs: []

  # ── Уровень страницы ─────────────────────────────────────────────────
  - id: header
    level: page
    text_element: false
    variability: stable
    expected_size: "1–5 строк на каждой странице"
    description: >-
      Верхний колонтитул: наименование документа/раздела, логотип
      организации; повторяется на всех или чётных/нечётных страницах.
    detection: >-
      python-docx: section.header; есть, если есть непустые параграфы
      или изображения (is_linked_to_previous == False или текст непуст).
    parser: >-
      Для каждой section: header.paragraphs → тексты; header tables
      при наличии; inline_shapes внутри колонтитула → логотип.
    attributes: [text]
    attributes_optional: [logo_image, section_title]
    sample_refs: []

  - id: footer
    level: page
    text_element: false
    variability: stable
    expected_size: "1–5 строк на каждой странице"
    description: "Нижний колонтитул: номер страницы, дата, версия, гриф ограничения доступа."
    detection: >-
      python-docx: section.footer содержит непустые параграфы или поля
      PAGE/NUMPAGES.
    parser: >-
      Для каждой section: footer.paragraphs → тексты; найти поля
      (w:fldChar/w:instrText) → тип поля; текстовые строки → метки.
    attributes: [text]
    attributes_optional: [page_number_field, date, version, classification]
    sample_refs: []

  - id: page-geometry
    level: page
    text_element: false
    variability: stable
    expected_size: "1 конфигурация на документ (размер, ориентация, поля)"
    description: >-
      Геометрия страницы: размер листа (A4/Letter), ориентация, поля
      (верх/низ/лево/право) — задаётся секцией DOCX; устанавливается
      по образцам (ГОСТ 2.301, ГОСТ Р 7.0.97).
    detection: >-
      python-docx: section.page_width/page_height/orientation и
      left/right/top/bottom_margin всех секций.
    parser: >-
      section → размер и поля в EMU/см; различия секций фиксировать
      по каждой (titlePg, чётные/нечётные).
    attributes: [page_size, orientation, margins]
    attributes_optional: [gutter, header_distance, footer_distance]
    sample_refs: []

  - id: first-page-diff
    level: page
    text_element: false
    variability: stable
    expected_size: "флаг titlePg + отличия header/footer первой страницы"
    description: >-
      Различие первой страницы (titlePg): у колонтитулов титула свой
