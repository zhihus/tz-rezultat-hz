      размер шрифта.
    attributes: [text, font_size]
    sample_refs: []

  - id: user-message-emphasis
    level: formatting
    text_element: true
    variability: fixed-if-present
    expected_size: "конвенция: 1 на документ (мажорита по образцам)"
    description: >-
      Выделение сообщения пользователю в тексте (naming-and-emphasis-
      universal): курсив и/или цвет, отличный от шрифта тела. Выводится
      автоматически из образцов; задавать вопрос пользователю не нужно.
    detection: >-
      Run в абзаце ТЕЛА (не заголовок, не подпись «Рисунок - N»/
      «Таблица - N») с w:i и/или w:color ≠ auto/чёрный.
    parser: >-
      Мажорита по кандидатам (extract_spec._derive_message_emphasis):
      italic — большинство курсивных; color — самый частый не-чёрный.
      Нет кандидатов → spec.meta.message_emphasis = null.
    attributes: [italic, bold, color]
    sample_refs: []

  - id: separator-line
    level: formatting
    text_element: false
    variability: variable
    expected_size: "0–N линий на документ"
    description: "Горизонтальная линия-разделитель между смысловыми блоками."
    detection: >-
      Параграф с pBdr (bottom border) без текста, либо текст из
      повторяющихся символов «—»/_/═.
    parser: >-
      Зафиксировать тип (граница параграфа/символьная линия) и позицию.
    attributes: [kind]
    selectable: false
    sample_refs: []

  - id: page-break
    level: formatting
    text_element: false
    variability: variable
    expected_size: "0–N разрывов; pageBreakBefore у стилей заголовков"
    description: >-
      Разрывы страниц: явный w:br type=page, pageBreakBefore у стилей
      (например, H1 с нового листа) и разрывы секций.
    detection: >-
      В параграфах: w:br[@w:type='page'], pPr/pageBreakBefore; в стилях —
      pageBreakBefore; sectPr — разрыв секции.
    parser: >-
      Обход параграфов → тип разрыва и позиция; для стилей — проверить
      style.paragraph_format.page_break_before.
    attributes: [kind, position]
    attributes_optional: [style_page_break_before]
    sample_refs: []

  - id: blank-page
    level: formatting
    text_element: false
    variability: stable
    expected_size: "0–2 на документ; перед разделами или в конце"
    description: "Пустая страница-разделитель: новый раздел с нового листа; последний лист с подписями обязателен даже пустой."
    detection: >-
      Разрыв страницы/секции (w:br type=page, sectPr) с отсутствием
      содержимого до следующего содержательного параграфа.
    parser: >-
      При обходе тела фиксировать пустые диапазоны между разрывами →
      пометить как пустые страницы.
    attributes: [position]
    selectable: false
    sample_refs: []

  # ── Технические ТЗ (E-50): описания объектов и реквизитов ───────────
  # ГЛАВНОЕ отличие тех-ТЗ — большой объём технического описания
  # объектов и их реквизитов (утверждено пользователем 2026-11-16).
  - id: requisites-list
    confirmed: samples
    level: page
    text_element: true
    variability: variable
    expected_size: "список 3–8 пар «имя/синоним/тип/…» на один реквизит"
    description: >-
      Описание нового реквизита/параметра списком-парами: имя,
      синоним, тип (ссылка на объект конфигурации), размещение,
      заполнение, отбор, видимость. ГЛАВНЫЙ маркер тех-ТЗ.
    detection: >-
      Серия элементов списка, каждый начинается со слова «имя»,
      «синоним», «тип», «размещение», «заполнение», «отбор»,
      «видимость», «реквизит» с последующим тире/дефисом.
    parser: >-
      Обход тела: элементы списка, текст которых начинается с одного
      из слов-маркеров → пара «ключ – значение» (разделитель — тире
      любого начертания). Группы подряд идущих пар = один реквизит.
    attributes: [name, synonym, type]
    attributes_optional: [placement, filling, filter, visibility]
    sample_refs: []

  - id: form-change
    confirmed: samples
    level: page
    text_element: true
    variability: variable
    expected_size: "абзацы/списки, 1–10 действий на форму"
    description: >-
      Описание изменения существующей формы/отчёта/АРМ: добавить
      команду/колонку/группу, изменить логику, переименовать; с
      указанием точечного пути метаданных (Обработка.X.Форма.Y).
    detection: >-
      Раздел с заголовком «изменение …» (документа/отчёта/формы/АРМ)
      ИЛИ абзацы, начинающиеся с «Добавить/Изменить/Переименовать/
      Настроить», рядом с точечным путём метаданных.
    parser: >-
      Абзацы и списки раздела целиком; пути метаданных (Документ.X.Y,
      Обработка.X.Форма.Y) — не менять, конвейер не переформатирует.
    attributes: [target, action]
    attributes_optional: [metadata_path, condition]
    sample_refs: []

  - id: new-roles-text
    confirmed: samples
    level: page
    text_element: true
    variability: variable
    expected_size: "абзацы, 1–5 ролей (текстом, без таблицы прав)"
    description: >-
      Раздел «Описание новых ролей» тех-ТЗ: роли перечисляются ТЕКСТОМ
      (в отличие от бизнес-ТЗ, где права — таблица с колонками
      Роль/Должность/Профиль).
    detection: >-
      Заголовок уровня 1 с «роль» в тексте и отсутствие таблицы прав
      в разделе (или явный текст «…не предполагается»).
    parser: >-
      Абзацы раздела целиком; имя роли — по паттерну префикса
      конвенции spec.meta.naming (выводится из выгрузки расширения); роли сверять с выгрузкой конфигурации
      отдельно (lint G6).
    attributes: [role_name]
    attributes_optional: [purpose]
    sample_refs: []

  - id: example-data-table
    confirmed: samples
    level: page
    text_element: false
    variability: variable
    expected_size: "таблица 2–15 колонок, строки = примеры данных"
    description: >-
      Пример-таблица тех-ТЗ: как заполняются новые данные (например,
      «реквизит/тип/заполнение» или широкие примеры расчёта на 11–15
      колонок). В отличие от бизнес-ТЗ, строк примера может быть
      несколько.
    detection: >-
      Таблица в разделе тех-ТЗ (после описания реквизитов/алгоритма);
      заголовки содержат «тип», «заполнение», «реквизит» или
      расчётные колонки.
    parser: >-
      Таблица целиком; первая строка данных → example_row; ширины
      колонок — из образца (широкие 11–15 колонок не сворачивать).
    attributes: [columns, rows]
    attributes_optional: [example_row, widths]
    sample_refs: []

# Подсказки разделов: ключ — подстрока названия раздела (lowercase),
# значение — текст серой подсказки. Данные, не код: добавление ключей
# не требует правки конвейера.
hints:
  "глоссарий": "ПОДСКАЗКА: заполните таблицу терминов и их описаний."
  "реквизит": "ПОДСКАЗКА: для каждого реквизита — имя, синоним, тип (объект конфигурации), размещение, заполнение."
  "изменение": "ПОДСКАЗКА: что именно меняется в форме/отчёте/документе и точечный путь метаданных."
  "новых ролей": "ПОДСКАЗКА: перечислите новые роли текстом и их назначение."
  "алгоритм": "ПОДСКАЗКА: опишите алгоритм по шагам; условия — в форме «если … тогда …»."
  "права": "ПОДСКАЗКА: перечислите должности, роли и профили доступа."
  "доступ": "ПОДСКАЗКА: перечислите должности, роли и профили доступа."
  "тестиров": "ПОДСКАЗКА: опишите действия и ожидаемый результат для приёмки."
  "приемк": "ПОДСКАЗКА: опишите действия и ожидаемый результат для приёмки."
  "ограничения": "ПОДСКАЗКА: перечислите ограничения и допущения (по одному в строке)."
  "допущ": "ПОДСКАЗКА: перечислите ограничения и допущения (по одному в строке)."
  "источники": "ПОДСКАЗКА: укажите функциональную модель (или протокол) и описание задачи."
